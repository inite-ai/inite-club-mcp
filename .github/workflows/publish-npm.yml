name: Publish to npm

# Called by release-please.yml with the release tag (a GITHUB_TOKEN tag push
# cannot trigger this workflow by itself). Dispatchable by hand to publish
# the version a ref carries. Idempotent: a version npm already has is
# skipped, so a re-run is safe.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish from (the release tag).
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from (empty = the ref this run was dispatched on).
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the attestation is signed with this run's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Before setup-node writes an .npmrc, so the lookup is anonymous.
      - name: Is this version already on npm?
        id: check
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION is already on npm; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $NAME@$VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require NPM_TOKEN
        if: steps.check.outputs.exists == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation (2FA-bypass) token with publish rights on @inite/club-mcp as a repository or organization secret named NPM_TOKEN."
            exit 1
          fi

      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      # The same gates CI runs, on the exact tree being published.
      # No lockfile is committed (it is git-ignored), so `npm ci` cannot run.
      - if: steps.check.outputs.exists == 'false'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.exists == 'false'
        run: npm run lint
      - if: steps.check.outputs.exists == 'false'
        run: node bin/cli.mjs --version
      - if: steps.check.outputs.exists == 'false'
        run: node bin/cli.mjs --help
      - if: steps.check.outputs.exists == 'false'
        run: npm test

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
